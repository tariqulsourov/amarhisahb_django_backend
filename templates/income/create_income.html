<div class="create_data_from_div content-wrapper" id="income-form-block" style="display: none;">
    <!-- Content Header (Page header) -->
    <div class="page-wrapper p-t-100 p-b-100 font-robo">
      <div class="wrapper wrapper--w680">
          <div class="card card-1">
              <div class="card-body">
                <div class="col-lg-12 col-md-12 col-12 justify-content-end p-0">
                  <a class="btn btn-standard text-dark py-1 px-5 float-right col-lg-4 col-md-4" onclick="show_income_list()">My income List</a>
                </div>
                  <h4 class="title font-weight-bold">+ New income</h4>
                  <form method="POST">
                    {% csrf_token %}

                    <div id="new-entry-block" class="p-3" style="display:none">
                      <p class="font-weight-bold">Please input new income related information</p>
                      <div class="input-group">
                        <p>Ex: Salary</p>
                          <input class="input--style-1" type="text" placeholder="INCOME TITLE" name="short_info">
                      </div>
                    </div>



                    <div id="select-details-block" class="p-4">
                      <p class="font-weight-bold">Please select income related information from previous</p>
                      <div><a class="btn btn-standard text-dark p-0 px-2 float-right" onclick="show_new_details_entry()">+ new income source</a></div>
                      <div class="input-group">
                        <div class="select-input">
                          <select class="input--style-1 col-sm-12 col-12" type="text" placeholder="income TITLE" name="select_short_info">
                            
                            <option class="input-option col-sm-12 col-12" value="">select income source</option>
                            {% for income_related in all_income_related %}
                              <option class="input-option col-sm-12 col-12" value="{{ income_related.id }}">{{ income_related.short_info }}</option>
                            {% endfor %}
                          </select>
                        </div>
                      </div>
                    </div>



                    <div id="entry-income-amount" class="p-4">
                      <br>
                      <p class="font-weight-bold">New income information</p>
                      <br>
                      <div class="input-group">
                        <div class="select-input">
                          <select class="input--style-1 col-sm-12 col-12" type="text" placeholder="Wallet" name="wallet">
                            
                            <option class="input-option col-sm-12 col-12" value="">select wallet</option>
                            {% for wallet in all_my_wallet %}
                              <option class="input-option col-sm-12 col-12" value="{{ wallet.id }}">{{ wallet.wallet_name }}</option>
                            {% endfor %}
                          </select>
                        </div>
                      </div>
                      <div class="input-group">
                        
                        <input class="input--style-1" type="text" placeholder="amount" name="amount" required>
                      </div>
                      <div class="input-group">
                        
                        <input class="input--style-1" type="text" placeholder="details" name="description">
                      </div>
                      
                      <div class="input-group">
                        
                          <input id="datepicker" class="input--style-1" type="text" onclick="(this.type='date')" onfocus="(this.type='date')" placeholder="{{ today_date }}"" name="income_date">
                      </div>
                      <div class="p-t-20">
                          <button class="btn btn--radius" type="submit">Submit</button>
                      </div>
                    </div>
                  </form>
              </div>
          </div>
      </div>
  </div>

  </div>
